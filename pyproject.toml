[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-assistant"
version = "0.1.0"
description = "A RAG-powered, agentic coding assistant for repository ingestion, Q&A, and code generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Engineering"}
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
]
eval = [
    "deepeval>=1.0.0",
    "groq>=0.5.0",
]

[project.scripts]
codebase-assistant = "codebase_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
